<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>사회구성주의 인터랙션 코칭 캔버스</title>
  
  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
          },
          colors: {
            slate: {
              850: '#151F32',
              900: '#0F172A',
            }
          }
        }
      }
    }
  </script>

  <!-- PeerJS CDN -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <!-- html2canvas CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      touch-action: manipulation;
    }
    
    /* 3D Card Flip Styles */
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }

    /* html2canvas export fix: Clean 2D rendering without 3D reverse text */
    .exporting-canvas .card-exporting.is-not-flipped .card-face-back {
      display: none !important;
    }
    .exporting-canvas .card-exporting.is-flipped .card-face-front {
      display: none !important;
    }
    .exporting-canvas .card-exporting.is-flipped .card-face-back {
      display: flex !important;
      transform: none !important;
    }
    .exporting-canvas .card-exporting .card-3d-inner {
      transform: none !important;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(241, 245, 249, 0.8);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }

    /* Deck Drawer Scrollbar - Thick & Visible */
    #deckCardsContainer::-webkit-scrollbar {
      height: 10px;
    }
    #deckCardsContainer::-webkit-scrollbar-track {
      background: #E2E8F0;
      border-radius: 6px;
      margin: 0 45px;
    }
    #deckCardsContainer::-webkit-scrollbar-thumb {
      background: #94A3B8;
      border-radius: 6px;
      border: 2px solid #E2E8F0;
    }
    #deckCardsContainer::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* Ghost Cursor Pulse */
    @keyframes cursorPulse {
      0% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 0.9; }
    }
    .peer-cursor {
      pointer-events: none;
      transition: left 0.08s ease-out, top 0.08s ease-out;
      z-index: 1000;
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 h-screen w-screen flex flex-col antialiased select-none">

  <!-- ================= TOP HEADER CONTROL BAR ================= -->
  <header class="bg-white border-b border-slate-200 shadow-sm z-30 shrink-0">
    <!-- Desktop Header (md and up) -->
    <div class="hidden md:flex px-4 py-2.5 items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="flex items-center space-x-2">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-sm">
            C
          </div>
          <div>
            <h1 class="font-bold text-base text-slate-900 leading-tight">사회구성주의 코칭 캔버스</h1>
            <p class="text-[11px] text-slate-500">Social Constructionism & Field Theory Interactive Canvas</p>
          </div>
        </div>

        <!-- Room & Connection Status -->
        <div class="flex items-center space-x-2 pl-3 border-l border-slate-200">
          <div id="statusBadge" class="flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-amber-50 text-amber-700 border border-amber-200">
            <span id="statusDot" class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
            <span id="statusText">룸 준비 중...</span>
          </div>
          
          <div class="flex items-center bg-slate-100 rounded-lg p-1 border border-slate-200 text-xs">
            <span class="text-slate-500 px-2 font-mono" id="roomIdDisplay">ROOM: ----</span>
            <button id="copyInviteBtn" onclick="copyInviteLink()" class="bg-white hover:bg-slate-50 text-slate-700 font-medium px-2 py-0.5 rounded shadow-xs border border-slate-200 flex items-center space-x-1 transition">
              <span>초대 링크 복사</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Center: 4 Coaching Modes -->
      <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200 space-x-1">
        <button onclick="changeMode(1)" id="modeBtn1" class="mode-tab px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center space-x-1.5 bg-white text-blue-600 shadow-xs">
          <span>🌐 [1] 장(Field) 등고선</span>
        </button>
        <button onclick="changeMode(2)" id="modeBtn2" class="mode-tab px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition flex items-center space-x-1.5">
          <span>💎 [2] 4대 자본 매트릭스</span>
        </button>
        <button onclick="changeMode(3)" id="modeBtn3" class="mode-tab px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition flex items-center space-x-1.5">
          <span>🎨 [3] 4색 목소리 소팅</span>
        </button>
        <button onclick="changeMode(4)" id="modeBtn4" class="mode-tab px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition flex items-center space-x-1.5">
          <span>⚡ [4] 힘장 액션 플래너</span>
        </button>
      </div>

      <!-- Right: Tools & Export -->
      <div class="flex items-center space-x-2">
        <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200 space-x-1">
          <button id="toolSelect" onclick="setTool('select')" class="tool-btn px-2.5 py-1.5 rounded-lg text-xs font-medium bg-white text-slate-800 shadow-xs flex items-center space-x-1" title="선택 및 카드 이동">
            <span>🖐️ 선택/이동</span>
          </button>
          <button id="toolLine" onclick="setTool('line')" class="tool-btn px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 flex items-center space-x-1" title="영향력/환전 화살표 긋기">
            <span>↗️ 연결선</span>
          </button>
          <button id="btnLineStyle" onclick="cycleLineStyle()" class="px-2 py-1.5 rounded-lg text-xs font-medium text-slate-500 hover:text-slate-800 border border-slate-200 bg-white" title="연결선 스타일: 〰️곡선 / 🔀절곡선(장애물 회피) / 📏직선">
            <span id="lineStyleLabel">〰️ 곡선</span>
          </button>
          <button id="toolNote" onclick="setTool('note')" class="tool-btn px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 flex items-center space-x-1" title="포스트잇 메모 작성">
            <span>📝 포스트잇</span>
          </button>
          <button onclick="clearCurrentCanvas()" class="px-2 py-1.5 rounded-lg text-xs font-medium text-rose-600 hover:bg-rose-50 transition" title="캔버스 요소 비우기">
            <span>🗑️ 비우기</span>
          </button>
        </div>

        <button onclick="exportCanvasToPng()" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-medium text-xs px-3 py-2 rounded-xl shadow-sm flex items-center space-x-1.5 transition">
          <span>📷 리포트 저장 (PNG)</span>
        </button>

        <a href="./manual.html" target="_blank" class="bg-white hover:bg-slate-50 text-slate-700 font-medium text-xs px-2.5 py-2 rounded-xl shadow-xs border border-slate-200 flex items-center space-x-1 transition" title="코치용 퍼실리테이션 매뉴얼 열기">
          <span>📖 매뉴얼</span>
        </a>
      </div>
    </div>

    <!-- Mobile Header (under md: 768px) -->
    <div class="flex md:hidden flex-col px-3 py-2 space-y-1.5 bg-white">
      <!-- Top mini bar -->
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-1.5">
          <div class="w-6 h-6 rounded-md bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white font-bold text-xs shadow-xs">
            C
          </div>
          <span class="font-bold text-xs text-slate-900">코칭 캔버스</span>
          <div id="mobileStatusBadge" class="flex items-center space-x-1 px-1.5 py-0.5 rounded-full text-[10px] bg-amber-50 text-amber-700 border border-amber-200">
            <span id="mobileStatusDot" class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>
            <span id="mobileStatusText">대기 중</span>
          </div>
        </div>

        <!-- Mode Select Dropdown -->
        <div class="flex items-center space-x-1">
          <select id="mobileModeSelect" onchange="changeMode(Number(this.value))" 
                  class="text-[11px] font-bold bg-blue-50 text-blue-700 border border-blue-200 rounded-lg px-2 py-1 focus:outline-none">
            <option value="1">🌐 1. 장 등고선</option>
            <option value="2">💎 2. 4대 자본</option>
            <option value="3">🎨 3. 4색 목소리</option>
            <option value="4">⚡ 4. 힘장 플래너</option>
          </select>
          <button onclick="exportCanvasToPng()" class="p-1 rounded-lg bg-indigo-50 text-indigo-700 border border-indigo-200 text-xs" title="PNG 저장">
            📷
          </button>
        </div>
      </div>

      <!-- Bottom mini tools bar -->
      <div class="flex items-center justify-between bg-slate-100 p-1 rounded-lg text-[10px]">
        <div class="flex items-center space-x-1">
          <button id="mobileToolSelect" onclick="setTool('select')" class="px-2 py-0.5 rounded bg-white text-slate-900 shadow-2xs font-semibold">🖐️ 이동</button>
          <button id="mobileToolLine" onclick="setTool('line')" class="px-2 py-0.5 rounded text-slate-600 hover:text-slate-900">↗️ 선</button>
          <button id="mobileLineStyle" onclick="cycleLineStyle()" class="px-1.5 py-0.5 rounded text-[11px] text-slate-500 border border-slate-200 bg-white" title="선 스타일">
            <span id="mobileLineStyleLabel">〰️</span>
          </button>
          <button id="mobileToolNote" onclick="setTool('note')" class="px-2 py-0.5 rounded text-slate-600 hover:text-slate-900">📝 메모</button>
          <button onclick="clearCurrentCanvas()" class="px-1.5 py-0.5 rounded text-rose-600">🗑️</button>
        </div>
        <div class="flex items-center space-x-1">
          <button onclick="toggleDrawer()" class="px-2 py-0.5 bg-blue-600 text-white rounded font-bold">🎴 카드덱</button>
          <a href="./manual.html" target="_blank" class="px-1.5 py-0.5 text-slate-500">📖</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Mobile Orientation Floating Tip -->
  <div id="orientationTip" class="fixed top-14 left-1/2 -translate-x-1/2 bg-slate-900/80 text-white text-[10px] px-3 py-1 rounded-full shadow-lg z-50 flex items-center space-x-1.5 md:hidden transition pointer-events-auto">
    <span>💡 스마트폰을 가로로 돌리면 더 넓게 보입니다</span>
    <button onclick="this.parentElement.remove()" class="text-slate-300 hover:text-white font-bold ml-1 px-1">&times;</button>
  </div>

  <!-- ================= MAIN SHARED CANVAS ================= -->
  <main class="relative flex-1 bg-[#F8FAFC] overflow-hidden" id="canvasContainer"
        onmousemove="handleCanvasMouseMove(event)"
        ondragover="handleCanvasDragOver(event)"
        ondrop="handleCanvasDrop(event)">
    
    <!-- Dynamic Background Layer (Template Rendered based on Mode) -->
    <div id="canvasBackground" class="absolute inset-0 pointer-events-none transition-all duration-300">
      <!-- Background populated via JS -->
    </div>

    <!-- SVG Layer for Connecting Lines & Arrows -->
    <svg id="svgOverlay" class="absolute inset-0 w-full h-full pointer-events-none z-10">
      <defs>
        <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6" />
        </marker>
        <marker id="arrowhead-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#F59E0B" />
        </marker>
        <marker id="arrowhead-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#10B981" />
        </marker>
      </defs>
      <!-- Connecting paths rendered dynamically -->
    </svg>

    <!-- Canvas Interactive Objects Layer -->
    <div id="canvasObjects" class="absolute inset-0 z-20 pointer-events-auto">
      <!-- Cards & Sticky Notes dynamically injected here -->
    </div>

    <!-- Remote Peer Cursor Ghost -->
    <div id="peerCursor" class="peer-cursor absolute hidden flex items-center space-x-1">
      <svg class="w-5 h-5 text-indigo-600 drop-shadow-md" fill="currentColor" viewBox="0 0 24 24">
        <path d="M4.5 2.5L18 10L11 12.5L8 19.5L4.5 2.5Z"/>
      </svg>
      <span id="peerCursorLabel" class="bg-indigo-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded shadow">상대방</span>
    </div>

    <!-- Drawing Temp Line Preview -->
    <svg id="tempSvg" class="absolute inset-0 w-full h-full pointer-events-none z-15">
      <line id="tempLine" x1="0" y1="0" x2="0" y2="0" stroke="#3B82F6" stroke-width="2.5" stroke-dasharray="5 5" class="hidden" />
    </svg>
  </main>

  <!-- ================= BOTTOM CARD DECK DRAWER ================= -->
  <div id="deckDrawer" class="bg-white/95 backdrop-blur-md border-t border-slate-200 shadow-xl transition-all duration-300 z-30 flex flex-col shrink-0" style="height: 220px;">
    <!-- Drawer Toggle Header -->
    <div class="px-3 sm:px-4 py-2 border-b border-slate-100 flex items-center justify-between bg-slate-50/80">
      <div class="flex items-center space-x-2 sm:space-x-3 overflow-x-auto">
        <button onclick="toggleDrawer()" class="flex items-center space-x-1 text-xs font-bold text-slate-700 hover:text-blue-600 transition shrink-0">
          <span id="drawerToggleIcon">▼</span>
          <span class="hidden sm:inline">한국어 성찰 코칭 카드 덱</span>
          <span class="sm:hidden">카드덱</span>
          <span id="deckCardCountBadge" class="text-[10px] font-bold text-blue-700 bg-blue-100/70 px-1.5 py-0.2 rounded-full ml-1">60장</span>
        </button>

        <!-- View Mode: 1-Row Slide vs 2-Row Grid -->
        <button id="deckViewModeBtn" onclick="toggleDeckViewMode()" class="text-[10px] sm:text-[11px] font-medium text-slate-600 hover:text-slate-900 bg-white border border-slate-200 px-2 py-0.5 rounded-md shadow-2xs hover:bg-slate-50 transition shrink-0">
          <span>⊞ 2줄 보기</span>
        </button>

        <!-- Theme Filter Pills -->
        <div class="flex items-center space-x-1 pl-2 border-l border-slate-200 overflow-x-auto shrink-0">
          <button onclick="filterCards(0)" class="theme-filter-pill px-2 py-0.5 rounded-full text-[10px] font-medium bg-blue-50 text-blue-700 border border-blue-200 shrink-0">전체</button>
          <button onclick="filterCards(1)" class="theme-filter-pill px-2 py-0.5 rounded-full text-[10px] font-medium text-slate-600 hover:bg-slate-100 shrink-0">1. 관계</button>
          <button onclick="filterCards(2)" class="theme-filter-pill px-2 py-0.5 rounded-full text-[10px] font-medium text-slate-600 hover:bg-slate-100 shrink-0">2. 기준</button>
          <button onclick="filterCards(3)" class="theme-filter-pill px-2 py-0.5 rounded-full text-[10px] font-medium text-slate-600 hover:bg-slate-100 shrink-0">3. 긴장</button>
          <button onclick="filterCards(4)" class="theme-filter-pill px-2 py-0.5 rounded-full text-[10px] font-medium text-slate-600 hover:bg-slate-100 shrink-0">4. 거리</button>
          <button onclick="filterCards(5)" class="theme-filter-pill px-2 py-0.5 rounded-full text-[10px] font-medium text-slate-600 hover:bg-slate-100 shrink-0">5. 실천</button>
        </div>
      </div>

      <!-- Search Box & Guide -->
      <div class="flex items-center space-x-2 shrink-0">
        <div class="relative">
          <input type="text" id="cardSearchInput" oninput="handleCardSearch()" placeholder="검색..." 
                 class="w-24 sm:w-36 text-xs pl-6 pr-2 py-1 rounded-lg bg-white border border-slate-200 focus:outline-none focus:border-blue-500 transition"/>
          <span class="absolute left-1.5 top-1.5 text-xs text-slate-400">🔍</span>
        </div>
      </div>
    </div>

    <!-- Cards Scroll Strip with Floating Left/Right Scroll Buttons -->
    <div class="relative flex-1 flex items-center overflow-hidden">
      <!-- Left Scroll Button -->
      <button onclick="scrollDeck(-350)" 
              class="absolute left-1 sm:left-2 top-1/2 -translate-y-1/2 z-30 w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-white/95 text-slate-700 hover:text-blue-600 hover:bg-white shadow-lg border border-slate-200 flex items-center justify-center font-bold text-xs sm:text-sm transition transform hover:scale-105 active:scale-95"
              title="이전 카드 보기 (좌측 스크롤)">
        ◀
      </button>

      <!-- Scrollable Container -->
      <div id="deckCardsContainer" class="flex-1 h-full overflow-x-auto overflow-y-hidden px-10 sm:px-14 py-2 sm:py-3 flex space-x-2.5 sm:space-x-3 items-center scroll-smooth">
        <!-- 60 Cards loaded here -->
      </div>

      <!-- Right Scroll Button -->
      <button onclick="scrollDeck(350)" 
              class="absolute right-1 sm:right-2 top-1/2 -translate-y-1/2 z-30 w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-white/95 text-slate-700 hover:text-blue-600 hover:bg-white shadow-lg border border-slate-200 flex items-center justify-center font-bold text-xs sm:text-sm transition transform hover:scale-105 active:scale-95"
              title="다음 카드 보기 (우측 스크롤)">
        ▶
      </button>
    </div>
  </div>

  <!-- ================= MODAL: LARGE CARD PREVIEW & FLIP ================= -->
  <div id="cardPreviewModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center hidden z-50 p-4" onclick="if(event.target === this) closeCardPreviewModal()">
    <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 max-w-sm sm:max-w-md w-full overflow-hidden animate-in fade-in zoom-in-95 duration-200 p-5 sm:p-6 flex flex-col items-center">
      <div class="w-full flex items-center justify-between pb-3 border-b border-slate-100 mb-3">
        <div class="flex items-center space-x-2">
          <span id="previewModalThemeBadge" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-blue-100 text-blue-700">관계와 연결</span>
          <span id="previewModalNumberBadge" class="font-mono text-xs font-bold text-slate-400">#01</span>
        </div>
        <button onclick="closeCardPreviewModal()" class="w-7 h-7 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 font-bold flex items-center justify-center transition">&times;</button>
      </div>

      <!-- Large 3D Flippable Card -->
      <div class="relative w-64 h-44 sm:w-80 sm:h-52 perspective-1000 cursor-pointer my-2 select-none" onclick="togglePreviewModalFlip()">
        <div id="previewModalCardInner" class="w-full h-full transform-style-3d transition-transform duration-500">
          <!-- Large Front (Photo) -->
          <div class="absolute inset-0 backface-hidden w-full h-full rounded-2xl overflow-hidden shadow-xl border-2 border-slate-200 bg-white">
            <img id="previewModalImg" src="" alt="Large Card" class="w-full h-full object-cover" />
            <div class="absolute bottom-2 right-2 bg-slate-900/75 backdrop-blur-xs text-white text-[10px] font-medium px-2 py-0.5 rounded-full flex items-center space-x-1">
              <span>🔄 탭하여 질문 보기</span>
            </div>
          </div>
          <!-- Large Back (Question) -->
          <div class="absolute inset-0 backface-hidden rotate-y-180 w-full h-full rounded-2xl p-5 shadow-xl border-2 border-blue-300 bg-gradient-to-br from-white to-blue-50/60 flex flex-col justify-between text-center">
            <div class="flex items-center justify-between text-[10px] text-blue-600 font-bold">
              <span>질문 성찰</span>
              <span id="previewModalBackNum" class="font-mono">#01</span>
            </div>
            <p id="previewModalQuestion" class="text-sm sm:text-base font-bold text-slate-800 leading-relaxed my-auto px-2">
              질문 내용이 여기에 표시됩니다.
            </p>
            <div class="text-[10px] text-blue-500 font-semibold flex items-center justify-center space-x-1">
              <span>🔄 탭하여 사진 보기</span>
            </div>
          </div>
        </div>
      </div>

    // 2. STATE MANAGEMENT
    const state = {
      roomId: null,
      peer: null,
      conn: null,
      isHost: false,
      isConnected: false,
      currentMode: 1, // 1: Field, 2: Capital, 3: Voice Sorting, 4: Force Field
      activeTool: 'select', // 'select', 'line', 'note'
      cardsOnCanvas: {}, // instanceId -> { id, cardId, xPct, yPct, isFlipped, scale, badge, actionPlan }
      notesOnCanvas: {}, // noteId -> { id, xPct, yPct, text, color }
      linesOnCanvas: {}, // lineId -> { id, x1Pct, y1Pct, x2Pct, y2Pct, label, color }
      lineStartPoint: null,
      lineStyle: 'curved', // 'curved' (smooth bezier), 'orthogonal' (smart route around cards), 'straight'
      previewCardId: null,
      previewModalFlipped: false,
      drawerOpen: window.innerWidth > 768, // auto-collapse on mobile!
      deckViewMode: 'single',
      currentFilterTheme: 0
    };

    // 3. INITIALIZATION
    window.addEventListener('DOMContentLoaded', () => {
      initDeckDrawer();
      renderCanvasBackground(state.currentMode);
      initPeerJS();

      // Mobile drawer initial height
      if (window.innerWidth <= 768) {
        document.getElementById('deckDrawer').style.height = '40px';
        document.getElementById('drawerToggleIcon').innerText = '▲';
        setTimeout(() => {
          const tip = document.getElementById('orientationTip');
          if (tip) tip.style.display = 'none';
        }, 5000);
      }

      // Listen to resize and orientation change to re-render background dynamically!
      window.addEventListener('resize', () => {
        renderCanvasBackground(state.currentMode);
        renderAllLines();
      });
      window.addEventListener('orientationchange', () => {
        setTimeout(() => {
          renderCanvasBackground(state.currentMode);
          renderAllLines();
        }, 200);
      });

      // Keyboard shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.key === 'v') setTool('select');
        if (e.key === 'l') setTool('line');
        if (e.key === 'n') setTool('note');
      });
    });

    // ================= PEERJS NETWORKING =================
    function initPeerJS() {
      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room');

      if (roomParam) {
        // GUEST MODE (Client)
        state.isHost = false;
        state.roomId = roomParam;
        updateStatusBadge('connecting', '코치 룸에 연결 중...');
        const roomStr = `ROOM: ${state.roomId} (고객)`;
        document.getElementById('roomIdDisplay').innerText = roomStr;

        state.peer = new Peer();
        state.peer.on('open', (id) => {
          console.log('[PeerJS] Guest Peer opened:', id);
          connectToHost(state.roomId);
        });
        state.peer.on('error', (err) => {
          console.error('[PeerJS] Error:', err);
          updateStatusBadge('error', '연결 오류');
        });
      } else {
        // HOST MODE (Coach)
        state.isHost = true;
        const randomCode = Math.floor(1000 + Math.random() * 9000);
        state.roomId = `COACH-${randomCode}`;
        document.getElementById('roomIdDisplay').innerText = `ROOM: ${state.roomId} (코치)`;

        state.peer = new Peer(state.roomId);
        state.peer.on('open', (id) => {
          console.log('[PeerJS] Host Peer opened with ID:', id);
          updateStatusBadge('waiting', '고객 접속 대기 중');
        });

        state.peer.on('connection', (connection) => {
          console.log('[PeerJS] Host received connection from guest');
          state.conn = connection;
          setupConnectionHandlers();
          // Send initial full state to guest
          setTimeout(() => {
            broadcast('SYNC_STATE', {
              currentMode: state.currentMode,
              cardsOnCanvas: state.cardsOnCanvas,
              notesOnCanvas: state.notesOnCanvas,
              linesOnCanvas: state.linesOnCanvas
            });
          }, 500);
        });

        state.peer.on('error', (err) => {
          console.error('[PeerJS] Host error:', err);
          updateStatusBadge('error', '룸 생성 오류');
        });
      }
    }

    function connectToHost(hostId) {
      state.conn = state.peer.connect(hostId);
      setupConnectionHandlers();
    }

    function setupConnectionHandlers() {
      state.conn.on('open', () => {
        state.isConnected = true;
        updateStatusBadge('connected', state.isHost ? '고객 연결됨 (1:1 코칭 중)' : '코치와 연결됨');
        console.log('[PeerJS] DataChannel Open!');
      });

      state.conn.on('data', (data) => {
        handleIncomingMessage(data);
      });

      state.conn.on('close', () => {
        state.isConnected = false;
        updateStatusBadge('waiting', state.isHost ? '고객 접속 끊김 (대기 중)' : '코치와 접속 종료');
      });
    }

    function broadcast(type, payload) {
      if (state.conn && state.isConnected) {
        try {
          state.conn.send({ type, payload });
        } catch (err) {
          console.error('[Broadcast Error]', err);
        }
      }
    }

    function handleIncomingMessage(msg) {
      const { type, payload } = msg;
      switch (type) {
        case 'SYNC_STATE':
          state.currentMode = payload.currentMode;
          state.cardsOnCanvas = payload.cardsOnCanvas || {};
          state.notesOnCanvas = payload.notesOnCanvas || {};
          state.linesOnCanvas = payload.linesOnCanvas || {};
          updateModeButtonsUI(state.currentMode);
          renderCanvasBackground(state.currentMode);
          renderAllCanvasObjects();
          renderAllLines();
          break;

        case 'CANVAS_MODE':
          state.currentMode = payload.mode;
          updateModeButtonsUI(payload.mode);
          renderCanvasBackground(payload.mode);
          break;

        case 'LINE_STYLE':
          state.lineStyle = payload.lineStyle;
          const lbl = document.getElementById('lineStyleLabel');
          if (lbl) lbl.innerText = { curved: '〰️ 곡선', orthogonal: '🔀 절곡선(회피)', straight: '📏 직선' }[state.lineStyle] || '〰️ 곡선';
          const mlbl = document.getElementById('mobileLineStyleLabel');
          if (mlbl) mlbl.innerText = { curved: '〰️', orthogonal: '🔀', straight: '📏' }[state.lineStyle] || '〰️';
          renderAllLines();
          break;

        case 'CARD_ADD':
        case 'CARD_UPDATE':
          state.cardsOnCanvas[payload.instanceId] = payload.data;
          renderCardElement(payload.data);
          break;

        case 'CARD_REMOVE':
          delete state.cardsOnCanvas[payload.instanceId];
          const el = document.getElementById(payload.instanceId);
          if (el) el.remove();
          break;

        case 'NOTE_ADD':
        case 'NOTE_UPDATE':
          state.notesOnCanvas[payload.noteId] = payload.data;
          renderNoteElement(payload.data);
          break;

        case 'NOTE_REMOVE':
          delete state.notesOnCanvas[payload.noteId];
          const nel = document.getElementById(payload.noteId);
          if (nel) nel.remove();
          break;

        case 'LINE_ADD':
          state.linesOnCanvas[payload.lineId] = payload.data;
          renderAllLines();
          break;

        case 'LINE_CLEAR':
          state.linesOnCanvas = {};
          renderAllLines();
          break;

        case 'CANVAS_CLEAR':
          state.cardsOnCanvas = {};
          state.notesOnCanvas = {};
          state.linesOnCanvas = {};
          document.getElementById('canvasObjects').innerHTML = '';
          renderAllLines();
          break;

        case 'CURSOR_MOVE':
          updateRemoteCursor(payload.xPct, payload.yPct, payload.role);
          break;
      }
    }

    function copyInviteLink() {
      const url = `${window.location.origin}${window.location.pathname}?room=${state.roomId}`;
      navigator.clipboard.writeText(url).then(() => {
        if (window.location.protocol === 'file:') {
          alert(`[주의: 로컬 파일(file://)로 열림]\n현재 코치님의 개인 PC 하드디스크 경로로 열려 있습니다.\n이 링크는 코치님의 PC에서만 열리며, 원격 고객은 접속할 수 없습니다.\n\n원격 고객과 실시간으로 함께 쓰시려면 GitHub Pages에 올리시는 것(가장 추천)이 좋습니다.\n\n복사된 주소: ${url}`);
        } else if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          alert(`[안내: 로컬 서버(localhost) 실행 중]\n복사된 주소: ${url}\n\n* 혼자 테스트하거나 창 2개로 시뮬레이션할 때는 정상 작동합니다.\n* 멀리 떨어진 원격 고객에게 보내시려면 GitHub Pages 주소(https://아이디.github.io/...)를 이용해 주세요.`);
        } else {
          alert(`원격 고객용 초대 링크가 복사되었습니다!\n고객에게 Zoom 채팅창이나 메신저로 전달하세요:\n${url}`);
        }
      });
    }

    // ================= TOOL SELECTION =================
    function setTool(toolName) {
      state.activeTool = toolName;
      // Desktop tool buttons
      document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.classList.remove('bg-white', 'text-slate-800', 'shadow-xs');
        btn.classList.add('text-slate-600');
      });
      // Mobile tool buttons
      ['mobileToolSelect', 'mobileToolLine', 'mobileToolNote'].forEach(id => {
        const mb = document.getElementById(id);
        if (mb) mb.className = "px-2 py-0.5 rounded text-slate-600 hover:text-slate-900";
      });

      if (toolName === 'select') {
        const b = document.getElementById('toolSelect');
        if (b) b.classList.add('bg-white', 'text-slate-800', 'shadow-xs');
        const mb = document.getElementById('mobileToolSelect');
        if (mb) mb.className = "px-2 py-0.5 rounded bg-white text-slate-900 shadow-2xs font-semibold";
      } else if (toolName === 'line') {
        const b = document.getElementById('toolLine');
        if (b) b.classList.add('bg-white', 'text-slate-800', 'shadow-xs');
        const mb = document.getElementById('mobileToolLine');
        if (mb) mb.className = "px-2 py-0.5 rounded bg-white text-slate-900 shadow-2xs font-semibold";
      } else if (toolName === 'note') {
        const b = document.getElementById('toolNote');
        if (b) b.classList.add('bg-white', 'text-slate-800', 'shadow-xs');
        const mb = document.getElementById('mobileToolNote');
        if (mb) mb.className = "px-2 py-0.5 rounded bg-white text-slate-900 shadow-2xs font-semibold";
      }
    }

    // ================= CARD DECK DRAWER =================
    function initDeckDrawer() {
      renderDrawerCards(CARDS_DATA);

      // Add Mouse Wheel Horizontal Scroll Listener
      const container = document.getElementById('deckCardsContainer');
      container.addEventListener('wheel', (e) => {
        if (e.deltaY !== 0) {
          e.preventDefault();
          container.scrollLeft += e.deltaY * 1.5;
        }
      }, { passive: false });
    }

    function scrollDeck(amount) {
      const container = document.getElementById('deckCardsContainer');
      container.scrollBy({ left: amount, behavior: 'smooth' });
    }

    function toggleDeckViewMode() {
      state.deckViewMode = state.deckViewMode === 'single' ? 'double' : 'single';
      const drawer = document.getElementById('deckDrawer');
      const container = document.getElementById('deckCardsContainer');
      const btn = document.getElementById('deckViewModeBtn');

      if (state.deckViewMode === 'double') {
        drawer.style.height = window.innerWidth <= 768 ? '280px' : '340px';
        container.className = "flex-1 h-full overflow-x-auto overflow-y-hidden px-10 sm:px-14 py-2 sm:py-3 grid grid-rows-2 grid-flow-col gap-2.5 sm:gap-3 items-center scroll-smooth";
        btn.innerHTML = '<span>⊟ 1줄</span>';
        btn.classList.add('bg-blue-50', 'text-blue-700', 'border-blue-200');
      } else {
        drawer.style.height = window.innerWidth <= 768 ? '180px' : '220px';
        container.className = "flex-1 h-full overflow-x-auto overflow-y-hidden px-10 sm:px-14 py-2 sm:py-3 flex space-x-2.5 sm:space-x-3 items-center scroll-smooth";
        btn.innerHTML = '<span>⊞ 2줄 보기</span>';
        btn.classList.remove('bg-blue-50', 'text-blue-700', 'border-blue-200');
      }
    }

    function toggleDrawer() {
      const drawer = document.getElementById('deckDrawer');
      const icon = document.getElementById('drawerToggleIcon');
      state.drawerOpen = !state.drawerOpen;

      if (state.drawerOpen) {
        const isMobile = window.innerWidth <= 768;
        if (state.deckViewMode === 'double') {
          drawer.style.height = isMobile ? '280px' : '340px';
        } else {
          drawer.style.height = isMobile ? '180px' : '220px';
        }
        icon.innerText = '▼';
      } else {
        drawer.style.height = window.innerWidth <= 768 ? '40px' : '36px';
        icon.innerText = '▲';
      }
    }

    function filterCards(themeNum) {
      state.currentFilterTheme = themeNum;
      document.querySelectorAll('.theme-filter-pill').forEach((pill, idx) => {
        if (idx === themeNum) {
          pill.className = "theme-filter-pill px-2 py-0.5 rounded-full text-[10px] font-medium bg-blue-50 text-blue-700 border border-blue-200 shrink-0";
        } else {
          pill.className = "theme-filter-pill px-2 py-0.5 rounded-full text-[10px] font-medium text-slate-600 hover:bg-slate-100 shrink-0";
        }
      });

      let filtered = CARDS_DATA;
      if (themeNum > 0) {
        const startId = (themeNum - 1) * 12 + 1;
        const endId = themeNum * 12;
        filtered = CARDS_DATA.filter(c => c.id >= startId && c.id <= endId);
      }
      renderDrawerCards(filtered);
    }

    function handleCardSearch() {
      const query = document.getElementById('cardSearchInput').value.trim().toLowerCase();
      let filtered = CARDS_DATA;
      if (state.currentFilterTheme > 0) {
        const startId = (state.currentFilterTheme - 1) * 12 + 1;
        const endId = state.currentFilterTheme * 12;
        filtered = CARDS_DATA.filter(c => c.id >= startId && c.id <= endId);
      }
      if (query) {
        filtered = filtered.filter(c => 
          c.question.toLowerCase().includes(query) || 
          c.keywords.toLowerCase().includes(query) ||
          c.theme.toLowerCase().includes(query) ||
          c.number_str.includes(query)
        );
      }
      renderDrawerCards(filtered);
    }

    // Tap to add card directly to canvas center (Super handy on mobile touch devices!)
    function addCardToCanvasCenter(cardId) {
      const instanceId = 'card_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
      // add with slight random offset around center
      const offsetX = (Math.random() - 0.5) * 16;
      const offsetY = (Math.random() - 0.5) * 16;

      const cardData = {
        id: instanceId,
        cardId: cardId,
        xPct: Math.max(10, Math.min(90, 50 + offsetX)),
        yPct: Math.max(10, Math.min(90, 45 + offsetY)),
        isFlipped: false,
        scale: window.innerWidth <= 768 ? 0.9 : 1.0,
        badge: null,
        actionPlan: { experiment: '', witness: '' }
      };

      state.cardsOnCanvas[instanceId] = cardData;
      renderCardElement(cardData);
      broadcast('CARD_ADD', { instanceId, data: cardData });

      // Auto-collapse drawer on mobile after adding to free up canvas space!
      if (window.innerWidth <= 768 && state.drawerOpen) {
        toggleDrawer();
      }
    }

    function renderDrawerCards(cardsList) {
      const container = document.getElementById('deckCardsContainer');
      const badge = document.getElementById('deckCardCountBadge');
      if (badge) badge.innerText = `${cardsList.length}장`;

      container.innerHTML = '';

      cardsList.forEach(card => {
        const item = document.createElement('div');
        item.className = "shrink-0 w-32 sm:w-36 h-24 sm:h-28 bg-white rounded-xl shadow-xs border border-slate-200 overflow-hidden cursor-grab active:cursor-grabbing hover:shadow-md hover:border-blue-400 transition flex flex-col group relative";
        item.draggable = true;

        item.innerHTML = `
          <div class="relative w-full h-15 sm:h-18 bg-slate-100 overflow-hidden cursor-pointer" onclick="openCardPreviewModal(${card.id})" title="클릭하여 크게 보기 & 질문 확인">
            <img src="${card.image_path}" alt="Card ${card.number_str}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300 pointer-events-none" />
            <span class="absolute top-1 right-1 bg-slate-900/70 text-white font-mono text-[8px] sm:text-[9px] px-1 py-0.2 rounded">#${card.number_str}</span>
            <div class="absolute top-1 left-1 bg-black/50 text-white text-[8px] px-1 py-0.2 rounded opacity-0 group-hover:opacity-100 transition flex items-center space-x-0.5">

            <button onclick="event.stopPropagation(); addCardToCanvasCenter(${card.id})" class="absolute bottom-1 right-1 bg-blue-600/95 hover:bg-blue-700 text-white text-[9px] font-bold px-1.5 py-0.5 rounded shadow flex items-center space-x-0.5 transition" title="캔버스에 바로 놓기">

            </button>

          </div>

        item.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', JSON.stringify({ cardId: card.id }));

    // ================= CANVAS DRAG & DROP =================
    function handleCanvasDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    }

    function handleCanvasDrop(e) {
      e.preventDefault();
      const rawData = e.dataTransfer.getData('text/plain');
      if (!rawData) return;

      try {
        const { cardId } = JSON.parse(rawData);
        if (!cardId) return;

        const rect = document.getElementById('canvasContainer').getBoundingClientRect();
        const xPct = Math.max(5, Math.min(95, ((e.clientX - rect.left) / rect.width) * 100));
        const yPct = Math.max(5, Math.min(95, ((e.clientY - rect.top) / rect.height) * 100));

        const instanceId = 'card_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
        const cardData = {
          id: instanceId,
          cardId: cardId,
          xPct: xPct,
          yPct: yPct,
          isFlipped: false,
          scale: window.innerWidth <= 768 ? 0.9 : 1.0,
          badge: null,
          actionPlan: { experiment: '', witness: '' }
        };

        state.cardsOnCanvas[instanceId] = cardData;
        renderCardElement(cardData);
        broadcast('CARD_ADD', { instanceId, data: cardData });

        if (state.currentMode === 3 && yPct > 55) {
          openVoiceModalForCard(instanceId);
        }
      } catch (err) {
        console.error('Drop error:', err);
      }
    }

      }

      cardEl.style.top = `${cardData.yPct}%`;
      cardEl.style.transform = `translate(-50%, -50%) scale(${cardData.scale || 1.0})`;

      const flipClass = cardData.isFlipped ? 'rotate-y-180' : '';

              <span class="font-bold text-amber-800 shrink-0">👁️ 증인:</span>

                     placeholder="지켜볼 사람"

          <!-- Floating Control Buttons (Visible on hover & touch) -->
          <div class="absolute -top-3 -right-2 z-30 flex items-center space-x-1 bg-white/95 rounded-full p-0.5 shadow-md border border-slate-200">
            <button onclick="toggleCardFlip('${cardData.id}', event)" class="w-6 h-6 rounded-full bg-blue-50 text-blue-600 hover:bg-blue-100 flex items-center justify-center text-xs" title="카드 뒤집기">🔄</button>
            <button onclick="removeCard('${cardData.id}', event)" class="w-6 h-6 rounded-full bg-rose-50 text-rose-600 hover:bg-rose-100 flex items-center justify-center text-xs" title="삭제">✕</button>
          </div>

          <!-- 3D Card Inner -->
          <div class="w-full h-full transform-style-3d card-3d-inner ${flipClass}" id="inner_${cardData.id}">

    function attachCardDragEvents(el, cardData) {
      let isDragging = false;
      let startX, startY;
      let initialXPct, initialYPct;

      const container = document.getElementById('canvasContainer');

      el.onpointerdown = (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'TEXTAREA') return;
        if (state.activeTool !== 'select') return;

        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        initialXPct = cardData.xPct;
        initialYPct = cardData.yPct;

        el.setPointerCapture(e.pointerId);
        e.stopPropagation();
      };

      el.onpointermove = (e) => {
        if (!isDragging) return;
        const rect = container.getBoundingClientRect();
        const deltaXPct = ((e.clientX - startX) / rect.width) * 100;
        const deltaYPct = ((e.clientY - startY) / rect.height) * 100;

        cardData.xPct = Math.max(5, Math.min(95, initialXPct + deltaXPct));
        cardData.yPct = Math.max(5, Math.min(95, initialYPct + deltaYPct));

        el.style.left = `${cardData.xPct}%`;
        el.style.top = `${cardData.yPct}%`;

        broadcast('CARD_UPDATE', { instanceId: cardData.id, data: cardData });
      };

      el.onpointerup = (e) => {
        if (!isDragging) return;
        isDragging = false;
        try { el.releasePointerCapture(e.pointerId); } catch(err) {}

        broadcast('CARD_UPDATE', { instanceId: cardData.id, data: cardData });

        if (state.currentMode === 3 && cardData.yPct > 50) {
          openVoiceModalForCard(cardData.id);
        }
      };

      // Double-click or tap to flip
      el.ondblclick = (e) => {
        e.stopPropagation();
        toggleCardFlip(cardData.id);
      };

      // Wheel to scale card
      el.onwheel = (e) => {
        e.preventDefault();
        const zoomDelta = e.deltaY < 0 ? 0.05 : -0.05;
        cardData.scale = Math.max(0.6, Math.min(1.8, (cardData.scale || 1.0) + zoomDelta));
        el.style.transform = `translate(-50%, -50%) scale(${cardData.scale})`;
        broadcast('CARD_UPDATE', { instanceId: cardData.id, data: cardData });
      };
    }

    function toggleCardFlip(instanceId, e) {
      if (e) e.stopPropagation();
      const card = state.cardsOnCanvas[instanceId];
      if (!card) return;

      card.isFlipped = !card.isFlipped;
      const inner = document.getElementById(`inner_${instanceId}`);
      if (inner) {
        if (card.isFlipped) inner.classList.add('rotate-y-180');
        else inner.classList.remove('rotate-y-180');
      }
      const container = document.getElementById(`flipContainer_${instanceId}`);
      if (container) {
        if (card.isFlipped) {
          container.classList.remove('is-not-flipped');
          container.classList.add('is-flipped');
        } else {
          container.classList.remove('is-flipped');
          container.classList.add('is-not-flipped');
        }
      }
      broadcast('CARD_UPDATE', { instanceId, data: card });
    }

    function removeCard(instanceId, e) {
      if (e) e.stopPropagation();
      delete state.cardsOnCanvas[instanceId];
      const el = document.getElementById(instanceId);
      if (el) el.remove();
      broadcast('CARD_REMOVE', { instanceId });
    }

    function updateActionPlan(instanceId, field, value) {
      const card = state.cardsOnCanvas[instanceId];
      if (!card) return;
      if (!card.actionPlan) card.actionPlan = {};
      card.actionPlan[field] = value;
      broadcast('CARD_UPDATE', { instanceId, data: card });
    }

    // ================= STICKY NOTES =================
    function createStickyNoteAt(xPct, yPct) {
      const noteId = 'note_' + Date.now() + '_' + Math.floor(Math.random() * 100);
      const noteData = {
        id: noteId,
        xPct: xPct,
        yPct: yPct,
        text: '',
        color: 'yellow'
      };

      state.notesOnCanvas[noteId] = noteData;
      renderNoteElement(noteData);
      broadcast('NOTE_ADD', { noteId, data: noteData });
    }

        noteEl = document.createElement('div');

        container.appendChild(noteEl);
      }

      noteEl.style.left = `${noteData.xPct}%`;
      noteEl.style.top = `${noteData.yPct}%`;
      noteEl.style.transform = `translate(-50%, -50%)`;

      noteEl.innerHTML = `
        <div class="w-36 h-28 sm:w-44 sm:h-36 bg-amber-100/95 border border-amber-300 rounded-xl shadow-lg p-2 flex flex-col justify-between">
          <div class="flex items-center justify-between pb-1 border-b border-amber-200">
            <span class="text-[9px] font-bold text-amber-800">📝 메모</span>
            <button onclick="removeNote('${noteData.id}')" class="text-amber-600 hover:text-amber-900 text-xs font-bold">&times;</button>
          </div>
          <textarea class="w-full h-full bg-transparent resize-none text-[10px] sm:text-xs text-slate-800 focus:outline-none p-1 leading-snug"
                    placeholder="성찰 메모..."
                    oninput="handleNoteTextInput('${noteData.id}', this.value)">${noteData.text || ''}</textarea>
        </div>
      `;

      attachNoteDragEvents(noteEl, noteData);
    }

    function attachNoteDragEvents(el, noteData) {
      let isDragging = false;
      let startX, startY;
      let initXPct, initYPct;
      const container = document.getElementById('canvasContainer');

      el.onpointerdown = (e) => {
        if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'BUTTON') return;
        if (state.activeTool !== 'select') return;

        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        initXPct = noteData.xPct;
        initYPct = noteData.yPct;

        el.setPointerCapture(e.pointerId);
        e.stopPropagation();
      };

      el.onpointermove = (e) => {
        if (!isDragging) return;
        const rect = container.getBoundingClientRect();
        const dXPct = ((e.clientX - startX) / rect.width) * 100;
        const dYPct = ((e.clientY - startY) / rect.height) * 100;

        noteData.xPct = Math.max(5, Math.min(95, initXPct + dXPct));
        noteData.yPct = Math.max(5, Math.min(95, initYPct + dYPct));

        el.style.left = `${noteData.xPct}%`;
        el.style.top = `${noteData.yPct}%`;
        broadcast('NOTE_UPDATE', { noteId: noteData.id, data: noteData });
      };

      el.onpointerup = (e) => {
        if (!isDragging) return;
        isDragging = false;
        try { el.releasePointerCapture(e.pointerId); } catch(err) {}
        broadcast('NOTE_UPDATE', { noteId: noteData.id, data: noteData });
      };
    }

    function handleNoteTextInput(noteId, text) {
      const note = state.notesOnCanvas[noteId];
      if (note) {
        note.text = text;
        broadcast('NOTE_UPDATE', { noteId, data: note });
      }
    }

    function removeNote(noteId) {
      delete state.notesOnCanvas[noteId];
      const el = document.getElementById(noteId);
      if (el) el.remove();
      broadcast('NOTE_REMOVE', { noteId });
    }

    // ================= CONNECTING LINES & ARROWS =================
    const canvasContainer = document.getElementById('canvasContainer');

    canvasContainer.addEventListener('mousedown', (e) => {
      if (state.activeTool === 'note') {
        const rect = canvasContainer.getBoundingClientRect();
        const xPct = ((e.clientX - rect.left) / rect.width) * 100;
        const yPct = ((e.clientY - rect.top) / rect.height) * 100;
        createStickyNoteAt(xPct, yPct);
        setTool('select');
      } else if (state.activeTool === 'line') {
        const rect = canvasContainer.getBoundingClientRect();
        const xPct = ((e.clientX - rect.left) / rect.width) * 100;
        const yPct = ((e.clientY - rect.top) / rect.height) * 100;
        state.lineStartPoint = { xPct, yPct, clientX: e.clientX, clientY: e.clientY };

        const tempLine = document.getElementById('tempLine');
        tempLine.setAttribute('x1', e.clientX - rect.left);
        tempLine.setAttribute('y1', e.clientY - rect.top);
        tempLine.setAttribute('x2', e.clientX - rect.left);
        tempLine.setAttribute('y2', e.clientY - rect.top);
        tempLine.classList.remove('hidden');
      }
    });

    canvasContainer.addEventListener('mousemove', (e) => {
      if (state.activeTool === 'line' && state.lineStartPoint) {
        const rect = canvasContainer.getBoundingClientRect();
        const tempLine = document.getElementById('tempLine');
        tempLine.setAttribute('x2', e.clientX - rect.left);
        tempLine.setAttribute('y2', e.clientY - rect.top);
      }
    });

    canvasContainer.addEventListener('mouseup', (e) => {
      if (state.activeTool === 'line' && state.lineStartPoint) {
        const rect = canvasContainer.getBoundingClientRect();
        const endXPct = ((e.clientX - rect.left) / rect.width) * 100;
        const endYPct = ((e.clientY - rect.top) / rect.height) * 100;

        document.getElementById('tempLine').classList.add('hidden');

        const dist = Math.hypot(endXPct - state.lineStartPoint.xPct, endYPct - state.lineStartPoint.yPct);
        if (dist > 3) {
          const lineId = 'line_' + Date.now();
          const lineData = {
            id: lineId,
            x1Pct: state.lineStartPoint.xPct,
            y1Pct: state.lineStartPoint.yPct,
            x2Pct: endXPct,
            y2Pct: endYPct,
            style: state.lineStyle || 'curved',
            color: state.currentMode === 2 ? '#F59E0B' : '#3B82F6',
            label: state.currentMode === 2 ? '환전선' : '영향력'
          };

          state.linesOnCanvas[lineId] = lineData;
          renderAllLines();
          broadcast('LINE_ADD', { lineId, data: lineData });
        }
        state.lineStartPoint = null;
        setTool('select');
      }
    });

    // Helper: Collect bounding boxes of cards on canvas
    function getCardBoundingBoxes(canvasRect) {
      const boxes = [];
      Object.values(state.cardsOnCanvas).forEach(card => {
        const el = document.getElementById(card.id);
        if (el) {
          const r = el.getBoundingClientRect();
          boxes.push({
            id: card.id,
            left: r.left - canvasRect.left,
            top: r.top - canvasRect.top,
            right: r.right - canvasRect.left,
            bottom: r.bottom - canvasRect.top,
            cx: (r.left + r.right) / 2 - canvasRect.left,
            cy: (r.top + r.bottom) / 2 - canvasRect.top,
            w: r.width,
            h: r.height
          });
        }
      });
      return boxes;
    }

    // Smart PowerPoint-Style Dynamic Connection Line Routing with Card Avoidance
    function computeSmartPath(x1, y1, x2, y2, style, boxes) {
      if (style === 'straight') {
        return {
          d: `M ${x1} ${y1} L ${x2} ${y2}`,
          midX: (x1 + x2) / 2,
          midY: (y1 + y2) / 2
        };
      }

      const dx = x2 - x1;
      const dy = y2 - y1;
      const len = Math.hypot(dx, dy);

      // Find any card blocking the direct path (excluding endpoints)
      let blocker = null;
      for (const box of boxes) {
        const pad = 12;
        const bx1 = box.left - pad, by1 = box.top - pad;
        const bx2 = box.right + pad, by2 = box.bottom + pad;

        const startInside = x1 >= bx1 && x1 <= bx2 && y1 >= by1 && y1 <= by2;
        const endInside = x2 >= bx1 && x2 <= bx2 && y2 >= by1 && y2 <= by2;
        if (startInside || endInside) continue;

        const u = Math.max(0, Math.min(1, ((box.cx - x1) * dx + (box.cy - y1) * dy) / (len * len || 1)));
        const projX = x1 + u * dx;
        const projY = y1 + u * dy;
        const dist = Math.hypot(box.cx - projX, box.cy - projY);

        if (dist < Math.max(box.w, box.h) / 2 + pad && u > 0.15 && u < 0.85) {
          blocker = box;
          break;
        }
      }

      if (style === 'orthogonal') {
        // PowerPoint-style stepped elbow / detour
        if (blocker) {
          const detourAbove = (y1 + y2) / 2 <= blocker.cy;
          const detourY = detourAbove ? blocker.top - 20 : blocker.bottom + 20;
          const corner1X = blocker.left - 20 < x1 ? (x1 + blocker.left) / 2 : blocker.left - 20;
          const corner2X = blocker.right + 20 > x2 ? (x2 + blocker.right) / 2 : blocker.right + 20;
          return {
            d: `M ${x1} ${y1} L ${corner1X} ${y1} L ${corner1X} ${detourY} L ${corner2X} ${detourY} L ${corner2X} ${y2} L ${x2} ${y2}`,
            midX: (corner1X + corner2X) / 2,
            midY: detourY
          };
        } else {
          const midX = (x1 + x2) / 2;
          return {
            d: `M ${x1} ${y1} L ${midX} ${y1} L ${midX} ${y2} L ${x2} ${y2}`,
            midX: midX,
            midY: (y1 + y2) / 2
          };
        }
      }

      // Default: 'curved' (Organic Smooth Bézier curve with obstacle bend)
      if (blocker) {
        const normX = -dy / (len || 1);
        const normY = dx / (len || 1);
        const toBlockerX = blocker.cx - (x1 + x2) / 2;
        const toBlockerY = blocker.cy - (y1 + y2) / 2;
        const dot = toBlockerX * normX + toBlockerY * normY;
        const sign = dot > 0 ? -1 : 1;
        const offset = Math.max(45, Math.min(130, len * 0.35)) * sign;

        const cx = (x1 + x2) / 2 + normX * offset;
        const cy = (y1 + y2) / 2 + normY * offset;
        return {
          d: `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`,
          midX: cx,
          midY: cy
        };
      } else {
        const normX = -dy / (len || 1);
        const normY = dx / (len || 1);
        const curvature = Math.min(32, len * 0.12);
        const cx1 = x1 + dx * 0.3 + normX * curvature;
        const cy1 = y1 + dy * 0.3 + normY * curvature;
        const cx2 = x1 + dx * 0.7 + normX * curvature;
        const cy2 = y1 + dy * 0.7 + normY * curvature;
        return {
          d: `M ${x1} ${y1} C ${cx1} ${cy1} ${cx2} ${cy2} ${x2} ${y2}`,
          midX: (x1 + x2) / 2 + normX * (curvature * 0.8),
          midY: (y1 + y2) / 2 + normY * (curvature * 0.8)
        };
      }
    }

    function cycleLineStyle() {
      const styles = ['curved', 'orthogonal', 'straight'];
      const nextIdx = (styles.indexOf(state.lineStyle) + 1) % styles.length;
      state.lineStyle = styles[nextIdx];

      const labels = {
        curved: '〰️ 곡선',
        orthogonal: '🔀 절곡선(회피)',
        straight: '📏 직선'
      };
      const mobileLabels = {
        curved: '〰️',
        orthogonal: '🔀',
        straight: '📏'
      };

      const lbl = document.getElementById('lineStyleLabel');
      if (lbl) lbl.innerText = labels[state.lineStyle];
      const mlbl = document.getElementById('mobileLineStyleLabel');
      if (mlbl) mlbl.innerText = mobileLabels[state.lineStyle];

      renderAllLines();
      broadcast('LINE_STYLE', { lineStyle: state.lineStyle });
    }

    function renderAllLines() {
      const svg = document.getElementById('svgOverlay');
      const defs = svg.querySelector('defs');
      svg.innerHTML = '';
      if (defs) svg.appendChild(defs);

      const rect = canvasContainer.getBoundingClientRect();
      const boxes = getCardBoundingBoxes(rect);

      Object.values(state.linesOnCanvas).forEach(line => {
        const x1 = (line.x1Pct / 100) * rect.width;
        const y1 = (line.y1Pct / 100) * rect.height;
        const x2 = (line.x2Pct / 100) * rect.width;
        const y2 = (line.y2Pct / 100) * rect.height;

        const lineStyle = line.style || state.lineStyle || 'curved';
        const pathData = computeSmartPath(x1, y1, x2, y2, lineStyle, boxes);

        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', pathData.d);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', line.color || '#3B82F6');
        path.setAttribute('stroke-width', '2.5');
        path.setAttribute('stroke-linecap', 'round');
        path.setAttribute('stroke-linejoin', 'round');
        path.setAttribute('marker-end', line.color === '#F59E0B' ? 'url(#arrowhead-amber)' : 'url(#arrowhead-blue)');

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', pathData.midX);
        text.setAttribute('y', pathData.midY - 6);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('fill', line.color || '#3B82F6');
        text.setAttribute('font-size', '10');
        text.setAttribute('font-weight', 'bold');
        text.textContent = line.label || '';

        g.appendChild(path);
        g.appendChild(text);
        svg.appendChild(g);
      });
    }

    // ================= CURSOR TRACKING =================
    let lastCursorSend = 0;
    function handleCanvasMouseMove(e) {
      const now = Date.now();
      if (now - lastCursorSend > 45) {
        lastCursorSend = now;
        const rect = canvasContainer.getBoundingClientRect();
        const xPct = ((e.clientX - rect.left) / rect.width) * 100;
        const yPct = ((e.clientY - rect.top) / rect.height) * 100;
        broadcast('CURSOR_MOVE', {
          xPct,
          yPct,
          role: state.isHost ? '코치' : '고객'
        });
      }
    }

    function updateRemoteCursor(xPct, yPct, role) {
      const cursor = document.getElementById('peerCursor');
      const label = document.getElementById('peerCursorLabel');
      cursor.classList.remove('hidden');
      cursor.style.left = `${xPct}%`;
      cursor.style.top = `${yPct}%`;
      label.innerText = role || '상대방';
    }

    // ================= CLEAR CANVAS =================
    function clearCurrentCanvas() {
      if (confirm('현재 캔버스의 모든 카드와 메모, 연결선을 비우시겠습니까?')) {
        state.cardsOnCanvas = {};
        state.notesOnCanvas = {};
        state.linesOnCanvas = {};
        document.getElementById('canvasObjects').innerHTML = '';
        renderAllLines();
        broadcast('CANVAS_CLEAR', {});
      }
    }

    function renderAllCanvasObjects() {
      const container = document.getElementById('canvasObjects');
      container.innerHTML = '';
      Object.values(state.cardsOnCanvas).forEach(card => renderCardElement(card));
      Object.values(state.notesOnCanvas).forEach(note => renderNoteElement(note));
    }


    // ================= LARGE CARD PREVIEW MODAL LOGIC =================
    function openCardPreviewModal(cardId) {
      const cardDef = CARDS_DATA.find(c => c.id === cardId);
      if (!cardDef) return;

      state.previewCardId = cardId;
      state.previewModalFlipped = false;

      document.getElementById('previewModalImg').src = cardDef.image_path;
      document.getElementById('previewModalQuestion').innerText = cardDef.question;
      document.getElementById('previewModalThemeBadge').innerText = cardDef.theme;
      document.getElementById('previewModalNumberBadge').innerText = `#${cardDef.number_str}`;
      document.getElementById('previewModalBackNum').innerText = `#${cardDef.number_str}`;

      const inner = document.getElementById('previewModalCardInner');
      inner.classList.remove('rotate-y-180');

      document.getElementById('cardPreviewModal').classList.remove('hidden');
    }

    function togglePreviewModalFlip() {
      state.previewModalFlipped = !state.previewModalFlipped;
      const inner = document.getElementById('previewModalCardInner');
      if (state.previewModalFlipped) {
        inner.classList.add('rotate-y-180');
      } else {
        inner.classList.remove('rotate-y-180');
      }
    }

    function closeCardPreviewModal() {
      document.getElementById('cardPreviewModal').classList.add('hidden');
      state.previewCardId = null;
    }

    function placePreviewCardToCanvas() {
      if (!state.previewCardId) return;
      addCardToCanvasCenter(state.previewCardId);
      closeCardPreviewModal();
    }

    // ================= MODE 3 NARRATIVE MODAL =================
    let activeModalCardId = null;
    function openVoiceModalForCard(instanceId) {
      activeModalCardId = instanceId;
      const card = state.cardsOnCanvas[instanceId];
      if (!card) return;

      const cardDef = CARDS_DATA.find(c => c.id === card.cardId);

      document.getElementById('voiceInputOriginal').value = card.badge?.originalVoice || (cardDef ? cardDef.question : '');
      document.getElementById('voiceInputProtection').value = card.badge?.protection || '';
      document.getElementById('voiceInputDignity').value = card.badge?.dignitySentence || '';

      document.getElementById('voiceModal').classList.remove('hidden');
    }

    function closeVoiceModal() {
      document.getElementById('voiceModal').classList.add('hidden');
      activeModalCardId = null;
    }

    function saveVoiceModal() {
      if (!activeModalCardId) return;
      const card = state.cardsOnCanvas[activeModalCardId];
      if (!card) return;

      const original = document.getElementById('voiceInputOriginal').value.trim();
      const protection = document.getElementById('voiceInputProtection').value.trim();
      const dignity = document.getElementById('voiceInputDignity').value.trim();

      if (!dignity) {
        alert('새롭게 고쳐 쓴 존엄 문장을 입력해 주세요.');
        return;
      }

      let category = '🟡 수정된 목소리';
      if (card.xPct < 25) category = '🟢 유지할 기준';
      else if (card.xPct < 50) category = '🟡 수정된 문장';
      else if (card.xPct < 75) category = '🔴 내려놓은 서사';
      else category = '🔵 보류한 가치';

      card.badge = {
        category: category,
        originalVoice: original,
        protection: protection,
        dignitySentence: dignity
      };

      renderCardElement(card);
      broadcast('CARD_UPDATE', { instanceId: activeModalCardId, data: card });
      closeVoiceModal();
    }

    // ================= EXPORT CANVAS TO PNG =================
    function exportCanvasToPng() {
      const canvasEl = document.getElementById('canvasContainer');
      const btn = event?.currentTarget;
      const originalText = btn ? btn.innerHTML : '';
      if (btn) btn.innerHTML = '<span>⏳ 저장 중...</span>';

      // 1. Prepare clean export: Add exporting-canvas class to resolve 3D flip mirror in html2canvas
      document.body.classList.add('exporting-canvas');
      
      // Ensure all card-exporting containers have exact current flip class
      Object.values(state.cardsOnCanvas).forEach(card => {
        const el = document.getElementById(`flipContainer_${card.id}`);
        if (el) {
          if (card.isFlipped) {
            el.classList.add('is-flipped');
            el.classList.remove('is-not-flipped');
          } else {
            el.classList.add('is-not-flipped');
            el.classList.remove('is-flipped');
          }
        }
      });

      setTimeout(() => {
        html2canvas(canvasEl, {
          scale: 2,
          useCORS: true,
          backgroundColor: '#F8FAFC',
          logging: false
        }).then(canvas => {
          const link = document.createElement('a');
          const now = new Date();
          const timeStr = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
          link.download = `Coaching_Canvas_Report_${timeStr}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
          document.body.classList.remove('exporting-canvas');
          if (btn) btn.innerHTML = originalText;
        }).catch(err => {
          console.error('Export error:', err);
          document.body.classList.remove('exporting-canvas');
          alert('이미지 저장 중 오류가 발생했습니다.');
          if (btn) btn.innerHTML = originalText;
        });
      }, 50);
    }
  </script>
</body>
