<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사회구성주의 인터랙션 코칭 캔버스</title>
  
  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
          },
          colors: {
            slate: {
              850: '#151F32',
              900: '#0F172A',
            }
          }
        }
      }
    }
  </script>

  <!-- PeerJS CDN -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <!-- html2canvas CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }
    
    /* 3D Card Flip Styles */
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(241, 245, 249, 0.8);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }

    /* Ghost Cursor Pulse */
    @keyframes cursorPulse {
      0% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 0.9; }
    }
    .peer-cursor {
      pointer-events: none;
      transition: left 0.08s ease-out, top 0.08s ease-out;
      z-index: 1000;
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 h-screen w-screen flex flex-col antialiased select-none">

  <!-- ================= TOP HEADER CONTROL BAR ================= -->
  <header class="bg-white border-b border-slate-200 shadow-sm px-4 py-2.5 flex items-center justify-between z-30 shrink-0">
    <div class="flex items-center space-x-3">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-sm">
          C
        </div>
        <div>
          <h1 class="font-bold text-base text-slate-900 leading-tight">사회구성주의 코칭 캔버스</h1>
          <p class="text-[11px] text-slate-500">Social Constructionism & Field Theory Interactive Canvas</p>
        </div>
      </div>

      <!-- Room & Connection Status -->
      <div class="flex items-center space-x-2 pl-3 border-l border-slate-200">
        <div id="statusBadge" class="flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-amber-50 text-amber-700 border border-amber-200">
          <span id="statusDot" class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
          <span id="statusText">룸 준비 중...</span>
        </div>
        
        <div class="flex items-center bg-slate-100 rounded-lg p-1 border border-slate-200 text-xs">
          <span class="text-slate-500 px-2 font-mono" id="roomIdDisplay">ROOM: ----</span>
          <button id="copyInviteBtn" onclick="copyInviteLink()" class="bg-white hover:bg-slate-50 text-slate-700 font-medium px-2 py-0.5 rounded shadow-xs border border-slate-200 flex items-center space-x-1 transition">
            <span>초대 링크 복사</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Center: 4 Coaching Modes -->
    <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200 space-x-1">
      <button onclick="changeMode(1)" id="modeBtn1" class="mode-tab px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center space-x-1.5 bg-white text-blue-600 shadow-xs">
        <span>🌐 [1] 장(Field) 등고선</span>
      </button>
      <button onclick="changeMode(2)" id="modeBtn2" class="mode-tab px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition flex items-center space-x-1.5">
        <span>💎 [2] 4대 자본 매트릭스</span>
      </button>
      <button onclick="changeMode(3)" id="modeBtn3" class="mode-tab px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition flex items-center space-x-1.5">
        <span>🎨 [3] 4색 목소리 소팅</span>
      </button>
      <button onclick="changeMode(4)" id="modeBtn4" class="mode-tab px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition flex items-center space-x-1.5">
        <span>⚡ [4] 힘장 액션 플래너</span>
      </button>
    </div>

    <!-- Right: Tools & Export -->
    <div class="flex items-center space-x-2">
      <!-- Tool Palette -->
      <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200 space-x-1">
        <button id="toolSelect" onclick="setTool('select')" class="tool-btn px-2.5 py-1.5 rounded-lg text-xs font-medium bg-white text-slate-800 shadow-xs flex items-center space-x-1" title="선택 및 카드 이동">
          <span>🖐️ 선택/이동</span>
        </button>
        <button id="toolLine" onclick="setTool('line')" class="tool-btn px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 flex items-center space-x-1" title="영향력/환전 화살표 긋기">
          <span>↗️ 연결선</span>
        </button>
        <button id="toolNote" onclick="setTool('note')" class="tool-btn px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 flex items-center space-x-1" title="포스트잇 메모 작성">
          <span>📝 포스트잇</span>
        </button>
        <button onclick="clearCurrentCanvas()" class="px-2 py-1.5 rounded-lg text-xs font-medium text-rose-600 hover:bg-rose-50 transition" title="캔버스 요소 비우기">
          <span>🗑️ 비우기</span>
        </button>
      </div>

      <!-- Export PNG Button -->
      <button onclick="exportCanvasToPng()" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-medium text-xs px-3.5 py-2 rounded-xl shadow-sm flex items-center space-x-1.5 transition">
        <span>📷 세션 리포트 저장 (PNG)</span>
      </button>
    </div>
  </header>

  <!-- ================= MAIN SHARED CANVAS ================= -->
  <main class="relative flex-1 bg-[#F8FAFC] overflow-hidden" id="canvasContainer"
        onmousemove="handleCanvasMouseMove(event)"
        ondragover="handleCanvasDragOver(event)"
        ondrop="handleCanvasDrop(event)">
    
    <!-- Dynamic Background Layer (Template Rendered based on Mode) -->
    <div id="canvasBackground" class="absolute inset-0 pointer-events-none transition-all duration-300">
      <!-- Background populated via JS -->
    </div>

    <!-- SVG Layer for Connecting Lines & Arrows -->
    <svg id="svgOverlay" class="absolute inset-0 w-full h-full pointer-events-none z-10">
      <defs>
        <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6" />
        </marker>
        <marker id="arrowhead-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#F59E0B" />
        </marker>
        <marker id="arrowhead-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#10B981" />
        </marker>
      </defs>
      <!-- Connecting paths rendered dynamically -->
    </svg>

    <!-- Canvas Interactive Objects Layer -->
    <div id="canvasObjects" class="absolute inset-0 z-20 pointer-events-auto">
      <!-- Cards & Sticky Notes dynamically injected here -->
    </div>

    <!-- Remote Peer Cursor Ghost -->
    <div id="peerCursor" class="peer-cursor absolute hidden flex items-center space-x-1">
      <svg class="w-5 h-5 text-indigo-600 drop-shadow-md" fill="currentColor" viewBox="0 0 24 24">
        <path d="M4.5 2.5L18 10L11 12.5L8 19.5L4.5 2.5Z"/>
      </svg>
      <span id="peerCursorLabel" class="bg-indigo-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded shadow">상대방</span>
    </div>

    <!-- Drawing Temp Line Preview -->
    <svg id="tempSvg" class="absolute inset-0 w-full h-full pointer-events-none z-15">
      <line id="tempLine" x1="0" y1="0" x2="0" y2="0" stroke="#3B82F6" stroke-width="2.5" stroke-dasharray="5 5" class="hidden" />
    </svg>
  </main>

  <!-- ================= BOTTOM CARD DECK DRAWER ================= -->
  <div id="deckDrawer" class="bg-white/95 backdrop-blur-md border-t border-slate-200 shadow-xl transition-all duration-300 z-30 flex flex-col shrink-0" style="height: 220px;">
    <!-- Drawer Toggle Header -->
    <div class="px-4 py-2 border-b border-slate-100 flex items-center justify-between bg-slate-50/80">
      <div class="flex items-center space-x-3">
        <button onclick="toggleDrawer()" class="flex items-center space-x-1.5 text-xs font-bold text-slate-700 hover:text-blue-600 transition">
          <span id="drawerToggleIcon">▼</span>
          <span>한국어 성찰 코칭 카드 덱 (총 60선)</span>
        </button>

        <div class="flex items-center space-x-1 pl-3 border-l border-slate-200">

          <button onclick="filterCards(2)" class="theme-filter-pill px-2.5 py-0.5 rounded-full text-[11px] font-medium text-slate-600 hover:bg-slate-100">2. 내면화된 기준</button>
          <button onclick="filterCards(3)" class="theme-filter-pill px-2.5 py-0.5 rounded-full text-[11px] font-medium text-slate-600 hover:bg-slate-100">3. 긴장 완화</button>
          <button onclick="filterCards(4)" class="theme-filter-pill px-2.5 py-0.5 rounded-full text-[11px] font-medium text-slate-600 hover:bg-slate-100">4. 문제 거리두기</button>
          <button onclick="filterCards(5)" class="theme-filter-pill px-2.5 py-0.5 rounded-full text-[11px] font-medium text-slate-600 hover:bg-slate-100">5. 작은 실천</button>
        </div>
      </div>

      <!-- Search Box & Guide -->
      <div class="flex items-center space-x-3">
        <div class="text-[11px] text-slate-400 hidden sm:block">💡 마우스로 사진을 캔버스로 드래그하여 배치하세요</div>

        </div>
      </div>
    </div>

    <!-- Cards Scroll Strip -->
    <div id="deckCardsContainer" class="flex-1 overflow-x-auto overflow-y-hidden px-4 py-3 flex space-x-3 items-center">
      <!-- 60 Cards loaded here -->
    </div>
  </div>

  <!-- ================= MODAL: NARRATIVE VOICE RECONSTRUCTION (MODE 3) ================= -->

        </div>
        <button onclick="closeVoiceModal()" class="text-slate-400 hover:text-slate-600 text-lg">&times;</button>
      </div>

      <div class="p-6 space-y-4 text-xs">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">1. 원래 나를 재촉하거나 채찍질하던 목소리/규칙</label>
          <input type="text" id="voiceInputOriginal" placeholder="예: '쉬면 도태된다', '항상 완벽해야만 해'"

        </div>

        <div>

          <input type="text" id="voiceInputProtection" placeholder="예: 무책임해지지 않도록, 뒤처지지 않도록 긴장감을 줌" 
                 class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500"/>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">3. [재저작] 고객님의 존엄과 안녕을 위해 새롭게 고쳐 쓴 문장</label>
          <textarea id="voiceInputDignity" rows="3" placeholder="예: '나는 충분히 쉴 권리가 있으며, 쉼은 내일을 위한 가장 지혜로운 준비다.'" 
                    class="w-full px-3 py-2 border border-blue-200 rounded-lg bg-blue-50/30 focus:outline-none focus:border-blue-500 font-medium text-slate-900"></textarea>
        </div>
      </div>

      <div class="px-6 py-3 bg-slate-50 border-t border-slate-100 flex items-center justify-end space-x-2">
        <button onclick="closeVoiceModal()" class="px-3.5 py-1.5 text-xs text-slate-600 hover:text-slate-900">취소</button>
        <button onclick="saveVoiceModal()" class="px-4 py-1.5 text-xs font-bold bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow-xs">새 정체성 카드로 등록</button>
      </div>
    </div>
  </div>

    // 2. STATE MANAGEMENT
    const state = {
      roomId: null,
      peer: null,
      conn: null,
      isHost: false,
      isConnected: false,
      currentMode: 1, // 1: Field, 2: Capital, 3: Voice Sorting, 4: Force Field
      activeTool: 'select', // 'select', 'line', 'note'
      cardsOnCanvas: {}, // instanceId -> { id, cardId, xPct, yPct, isFlipped, scale, badge, actionPlan }
      notesOnCanvas: {}, // noteId -> { id, xPct, yPct, text, color }
      linesOnCanvas: {}, // lineId -> { id, x1Pct, y1Pct, x2Pct, y2Pct, label, color }
      lineStartPoint: null,
      drawerOpen: true,
      currentFilterTheme: 0
    };

    // 3. INITIALIZATION
    window.addEventListener('DOMContentLoaded', () => {
      initDeckDrawer();
      renderCanvasBackground(state.currentMode);
      initPeerJS();

      // Keyboard shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.key === 'v') setTool('select');
        if (e.key === 'l') setTool('line');
        if (e.key === 'n') setTool('note');
      });
    });

    // ================= PEERJS NETWORKING =================
    function initPeerJS() {
      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room');

      if (roomParam) {
        // GUEST MODE (Client)
        state.isHost = false;
        state.roomId = roomParam;
        updateStatusBadge('connecting', '코치 룸에 연결 중...');
        document.getElementById('roomIdDisplay').innerText = `ROOM: ${state.roomId} (고객)`;

        state.peer = new Peer();
        state.peer.on('open', (id) => {
          console.log('[PeerJS] Guest Peer opened:', id);
          connectToHost(state.roomId);
        });
        state.peer.on('error', (err) => {
          console.error('[PeerJS] Error:', err);
          updateStatusBadge('error', '연결 오류');
        });
      } else {
        // HOST MODE (Coach)
        state.isHost = true;
        const randomCode = Math.floor(1000 + Math.random() * 9000);
        state.roomId = `COACH-${randomCode}`;
        document.getElementById('roomIdDisplay').innerText = `ROOM: ${state.roomId} (코치)`;

        state.peer = new Peer(state.roomId);
        state.peer.on('open', (id) => {
          console.log('[PeerJS] Host Peer opened with ID:', id);
          updateStatusBadge('waiting', '고객 접속 대기 중');
        });

        state.peer.on('connection', (connection) => {
          console.log('[PeerJS] Host received connection from guest');
          state.conn = connection;
          setupConnectionHandlers();
          // Send initial full state to guest
          setTimeout(() => {
            broadcast('SYNC_STATE', {
              currentMode: state.currentMode,
              cardsOnCanvas: state.cardsOnCanvas,
              notesOnCanvas: state.notesOnCanvas,
              linesOnCanvas: state.linesOnCanvas
            });
          }, 500);
        });

        state.peer.on('error', (err) => {
          console.error('[PeerJS] Host error:', err);
          updateStatusBadge('error', '룸 생성 오류');
        });
      }
    }

    function connectToHost(hostId) {
      state.conn = state.peer.connect(hostId);
      setupConnectionHandlers();
    }

    function setupConnectionHandlers() {
      state.conn.on('open', () => {
        state.isConnected = true;
        updateStatusBadge('connected', state.isHost ? '고객 연결됨 (1:1 코칭 중)' : '코치와 연결됨');
        console.log('[PeerJS] DataChannel Open!');
      });

      state.conn.on('data', (data) => {
        handleIncomingMessage(data);
      });

      state.conn.on('close', () => {
        state.isConnected = false;
        updateStatusBadge('waiting', state.isHost ? '고객 접속 끊김 (대기 중)' : '코치와 접속 종료');
      });
    }

    function broadcast(type, payload) {
      if (state.conn && state.isConnected) {
        try {
          state.conn.send({ type, payload });
        } catch (err) {
          console.error('[Broadcast Error]', err);
        }
      }
    }

    function handleIncomingMessage(msg) {
      const { type, payload } = msg;
      switch (type) {
        case 'SYNC_STATE':
          state.currentMode = payload.currentMode;
          state.cardsOnCanvas = payload.cardsOnCanvas || {};
          state.notesOnCanvas = payload.notesOnCanvas || {};
          state.linesOnCanvas = payload.linesOnCanvas || {};
          updateModeButtonsUI(state.currentMode);
          renderCanvasBackground(state.currentMode);
          renderAllCanvasObjects();
          renderAllLines();
          break;

        case 'CANVAS_MODE':
          state.currentMode = payload.mode;
          updateModeButtonsUI(payload.mode);
          renderCanvasBackground(payload.mode);
          break;

        case 'CARD_ADD':
        case 'CARD_UPDATE':
          state.cardsOnCanvas[payload.instanceId] = payload.data;
          renderCardElement(payload.data);
          break;

        case 'CARD_REMOVE':
          delete state.cardsOnCanvas[payload.instanceId];
          const el = document.getElementById(payload.instanceId);
          if (el) el.remove();
          break;

        case 'NOTE_ADD':
        case 'NOTE_UPDATE':
          state.notesOnCanvas[payload.noteId] = payload.data;
          renderNoteElement(payload.data);
          break;

        case 'NOTE_REMOVE':
          delete state.notesOnCanvas[payload.noteId];
          const nel = document.getElementById(payload.noteId);
          if (nel) nel.remove();
          break;

        case 'LINE_ADD':
          state.linesOnCanvas[payload.lineId] = payload.data;
          renderAllLines();
          break;

        case 'LINE_CLEAR':
          state.linesOnCanvas = {};
          renderAllLines();
          break;

        case 'CANVAS_CLEAR':
          state.cardsOnCanvas = {};
          state.notesOnCanvas = {};
          state.linesOnCanvas = {};
          document.getElementById('canvasObjects').innerHTML = '';
          renderAllLines();
          break;

        case 'CURSOR_MOVE':
          updateRemoteCursor(payload.xPct, payload.yPct, payload.role);
          break;
      }
    }

    function updateStatusBadge(status, text) {
      const badge = document.getElementById('statusBadge');
      const dot = document.getElementById('statusDot');
      const label = document.getElementById('statusText');

      label.innerText = text;
      if (status === 'connected') {
        badge.className = "flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200";
        dot.className = "w-2 h-2 rounded-full bg-emerald-500";
      } else if (status === 'connecting') {
        badge.className = "flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-blue-50 text-blue-700 border border-blue-200";
        dot.className = "w-2 h-2 rounded-full bg-blue-500 animate-pulse";
      } else {
        badge.className = "flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-amber-50 text-amber-700 border border-amber-200";
        dot.className = "w-2 h-2 rounded-full bg-amber-500 animate-pulse";
      }
    }

        if (window.location.protocol === 'file:') {
          alert(`[주의: 로컬 파일(file://)로 열림]\n현재 코치님의 개인 PC 하드디스크 경로로 열려 있습니다.\n이 링크는 코치님의 PC에서만 열리며, 원격 고객은 접속할 수 없습니다.\n\n원격 고객과 실시간으로 함께 쓰시려면 GitHub Pages에 올리시는 것(가장 추천)이 좋습니다.\n\n복사된 주소: ${url}`);
        } else if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          alert(`[안내: 로컬 서버(localhost) 실행 중]\n복사된 주소: ${url}\n\n* 혼자 테스트하거나 창 2개로 시뮬레이션할 때는 정상 작동합니다.\n* 멀리 떨어진 원격 고객에게 보내시려면 GitHub Pages 주소(https://아이디.github.io/...)를 이용해 주세요.`);

    // ================= TOOL SELECTION =================
    function setTool(toolName) {
      state.activeTool = toolName;
      document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.classList.remove('bg-white', 'text-slate-800', 'shadow-xs');
        btn.classList.add('text-slate-600');
      });

      if (toolName === 'select') {
        document.getElementById('toolSelect').classList.add('bg-white', 'text-slate-800', 'shadow-xs');
      } else if (toolName === 'line') {
        document.getElementById('toolLine').classList.add('bg-white', 'text-slate-800', 'shadow-xs');
      } else if (toolName === 'note') {
        document.getElementById('toolNote').classList.add('bg-white', 'text-slate-800', 'shadow-xs');
      }
    }

    // ================= CARD DECK DRAWER =================
    function initDeckDrawer() {
      renderDrawerCards(CARDS_DATA);
    }

    function toggleDrawer() {
      const drawer = document.getElementById('deckDrawer');
      const icon = document.getElementById('drawerToggleIcon');
      state.drawerOpen = !state.drawerOpen;

      if (state.drawerOpen) {
        drawer.style.height = '220px';
        icon.innerText = '▼';
      } else {
        drawer.style.height = '36px';
        icon.innerText = '▲';
      }
    }

    function filterCards(themeNum) {
      state.currentFilterTheme = themeNum;
      document.querySelectorAll('.theme-filter-pill').forEach((pill, idx) => {
        if (idx === themeNum) {
          pill.className = "theme-filter-pill px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-blue-50 text-blue-700 border border-blue-200";
        } else {
          pill.className = "theme-filter-pill px-2.5 py-0.5 rounded-full text-[11px] font-medium text-slate-600 hover:bg-slate-100";
        }
      });

      let filtered = CARDS_DATA;
      if (themeNum > 0) {
        const startId = (themeNum - 1) * 12 + 1;
        const endId = themeNum * 12;
        filtered = CARDS_DATA.filter(c => c.id >= startId && c.id <= endId);
      }
      renderDrawerCards(filtered);
    }

    function handleCardSearch() {
      const query = document.getElementById('cardSearchInput').value.trim().toLowerCase();
      let filtered = CARDS_DATA;
      if (state.currentFilterTheme > 0) {
        const startId = (state.currentFilterTheme - 1) * 12 + 1;
        const endId = state.currentFilterTheme * 12;
        filtered = CARDS_DATA.filter(c => c.id >= startId && c.id <= endId);
      }
      if (query) {
        filtered = filtered.filter(c => 
          c.question.toLowerCase().includes(query) || 
          c.keywords.toLowerCase().includes(query) ||
          c.theme.toLowerCase().includes(query) ||
          c.number_str.includes(query)
        );
      }
      renderDrawerCards(filtered);
    }

    function renderDrawerCards(cardsList) {
      const container = document.getElementById('deckCardsContainer');
      container.innerHTML = '';

      cardsList.forEach(card => {
        const item = document.createElement('div');
        item.className = "shrink-0 w-36 h-28 bg-white rounded-xl shadow-xs border border-slate-200 overflow-hidden cursor-grab active:cursor-grabbing hover:shadow-md hover:border-blue-400 transition flex flex-col group relative";
        item.draggable = true;

        item.innerHTML = `
          <div class="relative w-full h-18 bg-slate-100 overflow-hidden">
            <img src="${card.image_path}" alt="Card ${card.number_str}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
            <span class="absolute top-1 right-1 bg-slate-900/70 text-white font-mono text-[9px] px-1 py-0.5 rounded">#${card.number_str}</span>

            <p class="text-[10px] text-slate-700 line-clamp-2 leading-tight">${card.question}</p>
          </div>
        `;

        item.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', JSON.stringify({ cardId: card.id }));
        });

      });

    // ================= CANVAS DRAG & DROP =================
    function handleCanvasDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    }

    function handleCanvasDrop(e) {
      e.preventDefault();
      const rawData = e.dataTransfer.getData('text/plain');
      if (!rawData) return;

      try {
        const { cardId } = JSON.parse(rawData);
        if (!cardId) return;

        const rect = document.getElementById('canvasContainer').getBoundingClientRect();
        const xPct = Math.max(5, Math.min(95, ((e.clientX - rect.left) / rect.width) * 100));
        const yPct = Math.max(5, Math.min(95, ((e.clientY - rect.top) / rect.height) * 100));

        const instanceId = 'card_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
        const cardData = {
          id: instanceId,
          cardId: cardId,
          xPct: xPct,
          yPct: yPct,
          isFlipped: false,
          scale: 1.0,
          badge: null,
          actionPlan: { experiment: '', witness: '' }
        };

        state.cardsOnCanvas[instanceId] = cardData;
        renderCardElement(cardData);
        broadcast('CARD_ADD', { instanceId, data: cardData });

        // If in Mode 3 (Voice Sorting), check if dropped in sorting zones
        if (state.currentMode === 3 && yPct > 60) {
          openVoiceModalForCard(instanceId);
        }
      } catch (err) {
        console.error('Drop error:', err);
      }
    }

    function attachCardDragEvents(el, cardData) {
      let isDragging = false;
      let startX, startY;
      let initialXPct, initialYPct;

      const container = document.getElementById('canvasContainer');

      el.onpointerdown = (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'TEXTAREA') return;
        if (state.activeTool !== 'select') return;

        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        initialXPct = cardData.xPct;
        initialYPct = cardData.yPct;

        el.setPointerCapture(e.pointerId);
        e.stopPropagation();
      };

      el.onpointermove = (e) => {
        if (!isDragging) return;
        const rect = container.getBoundingClientRect();
        const deltaXPct = ((e.clientX - startX) / rect.width) * 100;
        const deltaYPct = ((e.clientY - startY) / rect.height) * 100;

        cardData.xPct = Math.max(5, Math.min(95, initialXPct + deltaXPct));
        cardData.yPct = Math.max(5, Math.min(95, initialYPct + deltaYPct));

        el.style.left = `${cardData.xPct}%`;
        el.style.top = `${cardData.yPct}%`;

        broadcast('CARD_UPDATE', { instanceId: cardData.id, data: cardData });
      };

      el.onpointerup = (e) => {
        if (!isDragging) return;
        isDragging = false;
        try { el.releasePointerCapture(e.pointerId); } catch(err) {}

        broadcast('CARD_UPDATE', { instanceId: cardData.id, data: cardData });

        // In Mode 3, if dropped into sorting zones
        if (state.currentMode === 3 && cardData.yPct > 55) {
          openVoiceModalForCard(cardData.id);
        }
      };

      // Double-click to flip
      el.ondblclick = (e) => {
        e.stopPropagation();
        toggleCardFlip(cardData.id);
      };

      // Wheel to scale card
      el.onwheel = (e) => {
        e.preventDefault();
        const zoomDelta = e.deltaY < 0 ? 0.05 : -0.05;
        cardData.scale = Math.max(0.6, Math.min(1.8, (cardData.scale || 1.0) + zoomDelta));
        el.style.transform = `translate(-50%, -50%) scale(${cardData.scale})`;
        broadcast('CARD_UPDATE', { instanceId: cardData.id, data: cardData });
      };
    }

    function toggleCardFlip(instanceId, e) {
      if (e) e.stopPropagation();
      const card = state.cardsOnCanvas[instanceId];
      if (!card) return;

      card.isFlipped = !card.isFlipped;
      const inner = document.getElementById(`inner_${instanceId}`);
      if (inner) {
        if (card.isFlipped) inner.classList.add('rotate-y-180');
        else inner.classList.remove('rotate-y-180');
      }
      broadcast('CARD_UPDATE', { instanceId, data: card });
    }

    function removeCard(instanceId, e) {
      if (e) e.stopPropagation();
      delete state.cardsOnCanvas[instanceId];
      const el = document.getElementById(instanceId);
      if (el) el.remove();
      broadcast('CARD_REMOVE', { instanceId });
    }

    function updateActionPlan(instanceId, field, value) {
      const card = state.cardsOnCanvas[instanceId];
      if (!card) return;
      if (!card.actionPlan) card.actionPlan = {};
      card.actionPlan[field] = value;
      broadcast('CARD_UPDATE', { instanceId, data: card });
    }

    function attachNoteDragEvents(el, noteData) {

        el.style.left = `${noteData.xPct}%`;
        el.style.top = `${noteData.yPct}%`;
        broadcast('NOTE_UPDATE', { noteId: noteData.id, data: noteData });
      };

      el.onpointerup = (e) => {
        if (!isDragging) return;
        isDragging = false;
        try { el.releasePointerCapture(e.pointerId); } catch(err) {}
        broadcast('NOTE_UPDATE', { noteId: noteData.id, data: noteData });
      };
    }

    function handleNoteTextInput(noteId, text) {
      const note = state.notesOnCanvas[noteId];
      if (note) {
        note.text = text;
        broadcast('NOTE_UPDATE', { noteId, data: note });
      }
    }

    function removeNote(noteId) {
      delete state.notesOnCanvas[noteId];
      const el = document.getElementById(noteId);
      if (el) el.remove();
      broadcast('NOTE_REMOVE', { noteId });
    }

    // ================= CONNECTING LINES & ARROWS =================
    const canvasContainer = document.getElementById('canvasContainer');

    canvasContainer.addEventListener('mousedown', (e) => {
      if (state.activeTool === 'note') {
        const rect = canvasContainer.getBoundingClientRect();
        const xPct = ((e.clientX - rect.left) / rect.width) * 100;
        const yPct = ((e.clientY - rect.top) / rect.height) * 100;
        createStickyNoteAt(xPct, yPct);
        setTool('select');
      } else if (state.activeTool === 'line') {
        const rect = canvasContainer.getBoundingClientRect();
        const xPct = ((e.clientX - rect.left) / rect.width) * 100;
        const yPct = ((e.clientY - rect.top) / rect.height) * 100;
        state.lineStartPoint = { xPct, yPct, clientX: e.clientX, clientY: e.clientY };

        const tempLine = document.getElementById('tempLine');
        tempLine.setAttribute('x1', e.clientX - rect.left);
        tempLine.setAttribute('y1', e.clientY - rect.top);
        tempLine.setAttribute('x2', e.clientX - rect.left);
        tempLine.setAttribute('y2', e.clientY - rect.top);
        tempLine.classList.remove('hidden');
      }
    });

    canvasContainer.addEventListener('mousemove', (e) => {
      if (state.activeTool === 'line' && state.lineStartPoint) {
        const rect = canvasContainer.getBoundingClientRect();
        const tempLine = document.getElementById('tempLine');
        tempLine.setAttribute('x2', e.clientX - rect.left);
        tempLine.setAttribute('y2', e.clientY - rect.top);
      }
    });

    canvasContainer.addEventListener('mouseup', (e) => {
      if (state.activeTool === 'line' && state.lineStartPoint) {
        const rect = canvasContainer.getBoundingClientRect();
        const endXPct = ((e.clientX - rect.left) / rect.width) * 100;
        const endYPct = ((e.clientY - rect.top) / rect.height) * 100;

        document.getElementById('tempLine').classList.add('hidden');

        // Only draw if moved slightly
        const dist = Math.hypot(endXPct - state.lineStartPoint.xPct, endYPct - state.lineStartPoint.yPct);
        if (dist > 3) {
          const lineId = 'line_' + Date.now();
          const lineData = {
            id: lineId,
            x1Pct: state.lineStartPoint.xPct,
            y1Pct: state.lineStartPoint.yPct,
            x2Pct: endXPct,
            y2Pct: endYPct,
            color: state.currentMode === 2 ? '#F59E0B' : '#3B82F6',
            label: state.currentMode === 2 ? '환전선' : '영향력'
          };

          state.linesOnCanvas[lineId] = lineData;
          renderAllLines();
          broadcast('LINE_ADD', { lineId, data: lineData });
        }
        state.lineStartPoint = null;
        setTool('select');
      }
    });

    function renderAllLines() {
      const svg = document.getElementById('svgOverlay');
      // Keep defs
      const defs = svg.querySelector('defs');
      svg.innerHTML = '';
      if (defs) svg.appendChild(defs);

      const rect = canvasContainer.getBoundingClientRect();

      Object.values(state.linesOnCanvas).forEach(line => {
        const x1 = (line.x1Pct / 100) * rect.width;
        const y1 = (line.y1Pct / 100) * rect.height;
        const x2 = (line.x2Pct / 100) * rect.width;
        const y2 = (line.y2Pct / 100) * rect.height;

        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        path.setAttribute('x1', x1);
        path.setAttribute('y1', y1);
        path.setAttribute('x2', x2);
        path.setAttribute('y2', y2);
        path.setAttribute('stroke', line.color || '#3B82F6');
        path.setAttribute('stroke-width', '2.5');
        path.setAttribute('marker-end', line.color === '#F59E0B' ? 'url(#arrowhead-amber)' : 'url(#arrowhead-blue)');

        // Label in middle
        const midX = (x1 + x2) / 2;
        const midY = (y1 + y2) / 2;
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', midX);
        text.setAttribute('y', midY - 6);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('fill', line.color || '#3B82F6');
        text.setAttribute('font-size', '10');
        text.setAttribute('font-weight', 'bold');
        text.textContent = line.label || '';

        g.appendChild(path);
        g.appendChild(text);
        svg.appendChild(g);
      });
    }

    window.addEventListener('resize', () => {
      renderAllLines();
    });

    // ================= CURSOR TRACKING =================
    let lastCursorSend = 0;
    function handleCanvasMouseMove(e) {
      const now = Date.now();
      if (now - lastCursorSend > 45) { // throttle 45ms
        lastCursorSend = now;
        const rect = canvasContainer.getBoundingClientRect();
        const xPct = ((e.clientX - rect.left) / rect.width) * 100;
        const yPct = ((e.clientY - rect.top) / rect.height) * 100;
        broadcast('CURSOR_MOVE', {
          xPct,
          yPct,
          role: state.isHost ? '코치' : '고객'
        });
      }
    }

    function updateRemoteCursor(xPct, yPct, role) {
      const cursor = document.getElementById('peerCursor');
      const label = document.getElementById('peerCursorLabel');
      cursor.classList.remove('hidden');
      cursor.style.left = `${xPct}%`;
      cursor.style.top = `${yPct}%`;
      label.innerText = role || '상대방';
    }

    // ================= CLEAR CANVAS =================
    function clearCurrentCanvas() {
      if (confirm('현재 캔버스의 모든 카드와 메모, 연결선을 비우시겠습니까?')) {
        state.cardsOnCanvas = {};
        state.notesOnCanvas = {};
        state.linesOnCanvas = {};
        document.getElementById('canvasObjects').innerHTML = '';
        renderAllLines();
        broadcast('CANVAS_CLEAR', {});
      }
    }

    function renderAllCanvasObjects() {
      const container = document.getElementById('canvasObjects');
      container.innerHTML = '';
      Object.values(state.cardsOnCanvas).forEach(card => renderCardElement(card));
      Object.values(state.notesOnCanvas).forEach(note => renderNoteElement(note));
    }

    // ================= MODE 3 NARRATIVE MODAL =================
    let activeModalCardId = null;
    function openVoiceModalForCard(instanceId) {
      activeModalCardId = instanceId;
      const card = state.cardsOnCanvas[instanceId];
      if (!card) return;

      const cardDef = CARDS_DATA.find(c => c.id === card.cardId);

      document.getElementById('voiceInputOriginal').value = card.badge?.originalVoice || (cardDef ? cardDef.question : '');
      document.getElementById('voiceInputProtection').value = card.badge?.protection || '';
      document.getElementById('voiceInputDignity').value = card.badge?.dignitySentence || '';

      document.getElementById('voiceModal').classList.remove('hidden');
    }

    function closeVoiceModal() {
      document.getElementById('voiceModal').classList.add('hidden');
      activeModalCardId = null;
    }

    function saveVoiceModal() {
      if (!activeModalCardId) return;
      const card = state.cardsOnCanvas[activeModalCardId];
      if (!card) return;

      const original = document.getElementById('voiceInputOriginal').value.trim();
      const protection = document.getElementById('voiceInputProtection').value.trim();
      const dignity = document.getElementById('voiceInputDignity').value.trim();

      if (!dignity) {
        alert('새롭게 고쳐 쓴 존엄 문장을 입력해 주세요.');
        return;
      }

      // Determine Category by X location in Mode 3 (4 zones)
      let category = '🟡 수정된 목소리';
      if (card.xPct < 25) category = '🟢 유지할 기준';
      else if (card.xPct < 50) category = '🟡 수정된 문장';
      else if (card.xPct < 75) category = '🔴 내려놓은 서사';
      else category = '🔵 보류한 가치';

      card.badge = {
        category: category,
        originalVoice: original,
        protection: protection,
        dignitySentence: dignity
      };

      renderCardElement(card);
      broadcast('CARD_UPDATE', { instanceId: activeModalCardId, data: card });
      closeVoiceModal();
    }

    // ================= EXPORT CANVAS TO PNG =================
    function exportCanvasToPng() {
      const canvasEl = document.getElementById('canvasContainer');
      const btn = event.currentTarget;
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span>⏳ 저장 중...</span>';

      html2canvas(canvasEl, {
        scale: 2,
        useCORS: true,
        backgroundColor: '#F8FAFC'
      }).then(canvas => {
        const link = document.createElement('a');
        const now = new Date();
        const timeStr = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
        link.download = `Coaching_Canvas_Report_${timeStr}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        btn.innerHTML = originalText;
      }).catch(err => {
        console.error('Export error:', err);
        alert('이미지 저장 중 오류가 발생했습니다.');
        btn.innerHTML = originalText;
      });
    }
  </script>
</body>
</html>
